<html>
    <head>
        <style>
            .parent{
                justify-content:start;
                width:700px;
                height:700px;
                display:grid;
                grid-template-columns:200px 200px 200px;
                grid-template-rows: 300px 300px;
                /*grid-gap:20px 
                row-gap:20px;
                column-gap: 20px;
                /*align-items: stretch;*/
                justify-items:stretch;
                grid-gap:20px;
                grid-template-areas:"child1 child1 child2"
                                    "child1 child1 child2"
                                    "child1 child1 child2"
        

            }
            .class1{
              /* grid-column-start: 1;
               grid-column-end: 4; */
               /*grid-row-start:1;
               grid-row-end: 4; 
               grid-row:1/3; */
               grid-area: child1;
               

            }

            .parent div:nth-child(odd){
                background-color:yellow;
            }
            .parent div:nth-child(even){
                background-color: black;
            }
            .class2{
               /* grid-row:1/3;
                grid-column: 1/3; */
                grid-area:child2;
                align-self:center;
            }
            </style>
    </head>
    <body>
        <div class="parent"> 
            <div class="class1"> class1</div>
            <div class="class2"> class2</div>
            <div class="class3">class3</div>
            <div class="class4"> class4</div>
            
        </div>
    </body>
</html>
