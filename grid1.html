<html>
    <head>
        <style>
            .dad{
                height:100%;
                width:100%;
                display:grid;
                grid-template-columns: 20% 20% 20%;
                grid-template-rows: 20% 20% 40%;

            }
            .c1{
                background-color: orange;
                grid-column: 1/4;
            }
            .c2{
                background-color: green;
                grid-row: 2/3;
                grid-column: 1/3;
            }
            .c3{
                background-color: palevioletred;
                grid-column: 3/4;
                grid-row: 2/4;
            }
            .c4{
                background-color: rgb(15, 100, 128);
                grid-column: 1/2;
                grid-row: 3/4;
            }
            .c5{
                background-color: blue;
                grid-row: 3/4;
                grid-column: 2/3;
            }
        </style>

    </head>
    <body>
        <div class="dad">
            <div class="c1">c1</div>
            <div class="c2">c2</div>
            <div class="c3">c3</div>
            <div class="c4">c4</div>
            <div class="c5">c5</div>
        </div>
    </body>
</html>
