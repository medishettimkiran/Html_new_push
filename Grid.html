<html>
<head>
    <style>

    
    .container{
        height: 80vh;
        display:grid;
        grid-template-columns: 20% 20% 20% 20%;
        grid-template-rows: 20% 20% 50% 20%;
        grid-gap:20px;
        


        
    }
    .c1{
        background-color:orangered;
        grid-column: 1/5;
        grid-row:1/2 ;
        

    
    }
    .c2{
        background-color:orangered;
        grid-row: 2/3;
        grid-column:1/2;
        
    }
    
    .c3{
        background-color: orangered;
        grid-row: 2/3;
        grid-column:2/3;
    }
    .c4{
        background-color: orangered;
        grid-row: 2/3;
        grid-column: 3/4;
    }
    .c5{
        background-color: orangered;
        grid-row:2/4;
        grid-column: 4/5;
        
        
        
        
        
    }
    .c6{
        background-color: orangered;
        grid-column: 1/4;
        grid-row: 3/4;

    }
    .c7{
        background-color:orangered;
        grid-row: 4/5;
        grid-column: 1/5;
    }
    </style>

</head>
<body>
    <div class="container">
        <div class="c1">c1</div>
        <div class="c2">c2</div>
        <div class="c3">c3</div>
        <div class="c4">c4</div>
        <div class="c5">c5</div>
        <div class="c6">c6</div>
        <div class="c7">c7</div>

    </div>

</body>
</html>
